[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invotaxi-backend"
version = "0.1.0"
description = "InvoTaxi social taxi backend: FastAPI API + ARQ worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5,<6",
    "arq>=0.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "pytest-cov>=5",
    "websockets>=13",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "routing"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "routing", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "routing"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["routing"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "routing.*"
strict = true
